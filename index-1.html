<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لقاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2f6;
    --ink: #14232f;
    --muted: #5b6b78;
    --line: #cfd8e0;
    --accent: #0b6e6e;
    --accent-ink: #ffffff;
    --danger: #b3342b;
    --tile: #1b2a36;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* شاشة الدخول */
  #lobby {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .lobby-box { width: min(420px, 100%); }
  .lobby-box h1 { font-size: 2.2rem; margin: 0 0 6px; }
  .lobby-box p { color: var(--muted); margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .primary {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    cursor: pointer;
  }
  #lobbyError { color: var(--danger); min-height: 1.4em; margin-top: 12px; }

  /* غرفة الاجتماع */
  #room { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fff;
  }
  header strong { letter-spacing: .02em; }
  .link-btn {
    background: none; border: 1.5px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; color: var(--ink);
  }
  main { flex: 1; min-height: 0; display: flex; }
  #grid {
    flex: 1; min-width: 0; padding: 12px; overflow: auto;
    display: grid; gap: 10px; align-content: start;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  .tile {
    position: relative; background: var(--tile);
    border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9;
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.local video { transform: scaleX(-1); }
  .tile .name {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(20, 35, 47, .8); color: #fff;
    padding: 3px 10px; border-radius: 6px; font-size: .85rem;
  }
  .tile.cam-off video { visibility: hidden; }
  .tile.cam-off::after {
    content: "الكاميرا متوقفة"; position: absolute; inset: 0;
    display: grid; place-items: center; color: #9fb3c2;
  }

  /* الدردشة */
  #chat {
    width: 300px; border-inline-start: 1px solid var(--line);
    background: #fff; display: flex; flex-direction: column;
  }
  #messages { flex: 1; overflow: auto; padding: 12px; }
  .msg { margin-bottom: 10px; line-height: 1.5; }
  .msg b { display: block; font-size: .8rem; color: var(--muted); }
  #chatForm { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatForm input { flex: 1; }
  #chatForm button {
    border: 0; border-radius: 8px; padding: 0 14px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }

  /* أزرار التحكم */
  footer {
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 12px; background: #fff; border-top: 1px solid var(--line);
  }
  footer button {
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  }
  footer button.off { background: var(--danger); border-color: var(--danger); color: #fff; }
  footer button.leave { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }

  @media (max-width: 760px) {
    main { flex-direction: column; }
    #chat { width: 100%; height: 38%; border-inline-start: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<!-- شاشة الدخول -->
<section id="lobby">
  <div class="lobby-box">
    <h1>لقاء</h1>
    <p>ادخل اسمك ورمز الغرفة. من يستخدم الرمز نفسه يدخل الغرفة نفسها.</p>
    <label for="name">اسمك</label>
    <input type="text" id="name" autocomplete="name">
    <label for="roomCode">رمز الغرفة</label>
    <input type="text" id="roomCode" placeholder="مثال: فريق-العمل" dir="auto">
    <button class="primary" id="joinBtn">انضم إلى الغرفة</button>
    <div id="lobbyError" role="alert"></div>
  </div>
</section>

<!-- غرفة الاجتماع -->
<section id="room" class="hidden">
  <header>
    <strong id="roomTitle"></strong>
    <button class="link-btn" id="copyBtn">نسخ رابط الدعوة</button>
  </header>
  <main>
    <div id="grid"></div>
    <aside id="chat">
      <div id="messages" aria-live="polite"></div>
      <form id="chatForm">
        <input type="text" id="chatInput" placeholder="اكتب رسالة" autocomplete="off">
        <button type="submit">إرسال</button>
      </form>
    </aside>
  </main>
  <footer>
    <button id="micBtn">كتم الميكروفون</button>
    <button id="camBtn">إيقاف الكاميرا</button>
    <button id="leaveBtn" class="leave">مغادرة</button>
  </footer>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);

// خوادم STUN مجانية. للإنتاج أضف خادم TURN (مثل coturn) ليعمل الاتصال خلف أي شبكة
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

const socket = io();
const peers = new Map(); // معرّف المشارك -> { pc, tile, queue }
let localStream = null;
let currentRoom = '';

// تعبئة رمز الغرفة من الرابط إن وُجد
if (location.hash.length > 1) $('#roomCode').value = decodeURIComponent(location.hash.slice(1));

/* ---------- الواجهة ---------- */
function addTile(id, name, isLocal) {
  const el = document.createElement('div');
  el.className = 'tile' + (isLocal ? ' local' : '');
  el.id = 'tile-' + id;

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  if (isLocal) video.muted = true; // لا نسمع صوتنا

  const label = document.createElement('span');
  label.className = 'name';
  label.textContent = isLocal ? name + ' (أنت)' : name;

  el.append(video, label);
  $('#grid').append(el);
  return { el, video };
}

function addMessage(name, text) {
  const box = document.createElement('div');
  box.className = 'msg';
  const who = document.createElement('b');
  who.textContent = name;
  const body = document.createElement('span');
  body.textContent = text; // textContent يمنع حقن HTML
  box.append(who, body);
  $('#messages').append(box);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}

/* ---------- الدخول ---------- */
$('#joinBtn').onclick = async () => {
  const name = $('#name').value.trim();
  const room = $('#roomCode').value.trim();
  if (!name || !room) {
    $('#lobbyError').textContent = 'اكتب اسمك ورمز الغرفة أولاً.';
    return;
  }

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (e) {
    $('#lobbyError').textContent =
      'تعذّر الوصول إلى الكاميرا أو الميكروفون. اسمح بالوصول من إعدادات المتصفح. ملاحظة: يلزم https أو localhost.';
    return;
  }

  currentRoom = room;
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#roomTitle').textContent = 'الغرفة: ' + room;
  location.hash = encodeURIComponent(room);

  const me = addTile('me', name, true);
  me.video.srcObject = localStream;

  socket.emit('join', { room, name });
};

/* ---------- WebRTC ---------- */
function createPeer(id, name, initiator) {
  const pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  const tile = addTile(id, name, false);
  pc.ontrack = (e) => { tile.video.srcObject = e.streams[0]; };
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('signal', { to: id, data: { candidate: e.candidate } });
  };

  const peer = { pc, tile: tile.el, queue: Promise.resolve() };
  peers.set(id, peer);

  if (initiator) {
    pc.createOffer()
      .then((offer) => pc.setLocalDescription(offer))
      .then(() => socket.emit('signal', { to: id, data: { sdp: pc.localDescription } }));
  }
  return peer;
}

// الشخص الجديد يتصل بكل من في الغرفة
socket.on('peers', (list) => list.forEach((p) => createPeer(p.id, p.name, true)));

// استقبال رسائل الاتصال، مرتبة واحدة بعد الأخرى لكل مشارك
socket.on('signal', ({ from, name, data }) => {
  const peer = peers.get(from) || createPeer(from, name, false);
  peer.queue = peer.queue.then(async () => {
    const pc = peer.pc;
    if (data.sdp) {
      await pc.setRemoteDescription(data.sdp);
      if (data.sdp.type === 'offer') {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('signal', { to: from, data: { sdp: pc.localDescription } });
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(data.candidate); } catch (e) { /* تجاهل */ }
    }
  });
});

socket.on('peer-left', (id) => {
  const peer = peers.get(id);
  if (!peer) return;
  peer.pc.close();
  peer.tile.remove();
  peers.delete(id);
});

/* ---------- التحكم ---------- */
function toggleTrack(kind, btn, onText, offText) {
  const track = localStream.getTracks().find((t) => t.kind === kind);
  if (!track) return;
  track.enabled = !track.enabled;
  btn.textContent = track.enabled ? onText : offText;
  btn.classList.toggle('off', !track.enabled);
  if (kind === 'video') $('#tile-me').classList.toggle('cam-off', !track.enabled);
}
$('#micBtn').onclick = (e) => toggleTrack('audio', e.currentTarget, 'كتم الميكروفون', 'إلغاء الكتم');
$('#camBtn').onclick = (e) => toggleTrack('video', e.currentTarget, 'إيقاف الكاميرا', 'تشغيل الكاميرا');

$('#leaveBtn').onclick = () => {
  localStream.getTracks().forEach((t) => t.stop());
  peers.forEach((p) => p.pc.close());
  socket.disconnect();
  location.hash = '';
  location.reload();
};

$('#copyBtn').onclick = async (e) => {
  await navigator.clipboard.writeText(location.href);
  e.currentTarget.textContent = 'تم النسخ';
  setTimeout(() => (e.currentTarget.textContent = 'نسخ رابط الدعوة'), 1500);
};

/* ---------- الدردشة ---------- */
$('#chatForm').onsubmit = (e) => {
  e.preventDefault();
  const text = $('#chatInput').value.trim();
  if (!text) return;
  socket.emit('chat', text);
  $('#chatInput').value = '';
};
socket.on('chat', ({ name, text }) => addMessage(name, text));
</script>
</body>
</html>
